name: Fix viewer quality

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-viewer-quality.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix_viewer_quality.py
      - run: git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Keep R2 originals during viewer zoom"
          git push
