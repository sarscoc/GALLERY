name: One-shot gallery speedup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gallery-speedup.yml'

permissions:
  contents: write

jobs:
  speedup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch gallery loading for speed
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'patch target not found: {label}')
              s = s.replace(old, new, 1)

          # Smaller first response = fewer Notion/R2 checks and fewer images competing at once.
          replace_once(
              'const PAGE_SIZE = 18;',
              'const PAGE_SIZE = 12;',
              'PAGE_SIZE'
          )

          # Keep first-page JSON briefly in localStorage. Normal revisits can paint immediately;
          # the explicit Update button still bypasses this via force=true.
          replace_once(
              'const META_STORAGE_KEY="notion-image-gallery-meta-v1";\n',
              '''const META_STORAGE_KEY="notion-image-gallery-meta-v1";\nconst PAGE_CACHE_PREFIX="notion-image-gallery-page-v2:";\nconst PAGE_CACHE_TTL_MS=5*60*1000;\n\nfunction firstPageCacheKey(investigator,type){\n  return PAGE_CACHE_PREFIX+encodeURIComponent(investigator||"")+":"+encodeURIComponent(type||"")\n}\nfunction readStoredFirstPage(investigator,type){\n  try{\n    const raw=localStorage.getItem(firstPageCacheKey(investigator,type));\n    if(!raw)return null;\n    const parsed=JSON.parse(raw);\n    if(!parsed?.savedAt||Date.now()-parsed.savedAt>PAGE_CACHE_TTL_MS){\n      localStorage.removeItem(firstPageCacheKey(investigator,type));\n      return null\n    }\n    return parsed.data||null\n  }catch{\n    return null\n  }\n}\nfunction storeFirstPage(investigator,type,data){\n  try{\n    localStorage.setItem(\n      firstPageCacheKey(investigator,type),\n      JSON.stringify({savedAt:Date.now(),data})\n    )\n  }catch{}\n}\n''',
              'first-page cache helpers'
          )

          # Do not open every image connection at once. A small worker pool prioritizes the
          # first visible rows, then continues in the background while cards appear independently.
          old_batch = '''async function appendBatch(items,startIndex,serial,firstPage){\n  await Promise.all(items.map((item,i)=>\n    appendItem(item,startIndex+i,serial,firstPage&&i<6?"high":"auto")\n  ))\n}\n'''
          new_batch = '''async function appendBatch(items,startIndex,serial,firstPage){\n  if(!items.length)return;\n\n  const concurrency=Math.min(\n    items.length,\n    firstPage?Math.max(4,Math.min(6,columns.length)):4\n  );\n  let next=0;\n\n  async function runner(){\n    while(next<items.length){\n      const i=next++;\n      await appendItem(\n        items[i],\n        startIndex+i,\n        serial,\n        firstPage&&i<concurrency?"high":"low"\n      )\n    }\n  }\n\n  await Promise.all(\n    Array.from({length:concurrency},()=>runner())\n  )\n}\n'''
          replace_once(old_batch, new_batch, 'appendBatch')

          # Serve the cached first page without waiting for the Worker on ordinary revisits.
          old_request = '''    const {investigator,type}=currentFilters();\n    const data=await apiGet("/gallery-page",{\n      investigator,\n      type,\n      cursor:nextCursor,\n      page_size:PAGE_SIZE\n    },force);\n'''
          new_request = '''    const {investigator,type}=currentFilters();\n    const cachedPage=firstPage&&!force\n      ? readStoredFirstPage(investigator,type)\n      : null;\n\n    const data=cachedPage||await apiGet("/gallery-page",{\n      investigator,\n      type,\n      cursor:nextCursor,\n      page_size:PAGE_SIZE\n    },force);\n\n    if(firstPage&&!cachedPage){\n      storeFirstPage(investigator,type,data)\n    }\n'''
          replace_once(old_request, new_request, 'gallery-page request')

          # Avoid immediately pulling the next page while the first thumbnails are still arriving.
          replace_once(
              '},{root:null,rootMargin:"700px 0px",threshold:0});',
              '},{root:null,rootMargin:"200px 0px",threshold:0});',
              'IntersectionObserver margin'
          )

          # Meta/Notion lookup should never compete with the first gallery page.
          old_start = '''  /* INVESTIGATOR候補と画像を同時に開始。\n     メニュー候補が画像18枚の読込完了を待たない。 */\n  loadMeta();\n  await loadNextPage()\n'''
          new_start = '''  /* 前回の候補は即表示し、ネットワークのmeta取得は画像の後に回す。 */\n  const storedMeta=readStoredMeta();\n  if(storedMeta)applyMeta(storedMeta);\n\n  await loadNextPage();\n\n  if("requestIdleCallback" in window){\n    requestIdleCallback(()=>loadMeta(),{timeout:1500})\n  }else{\n    setTimeout(()=>loadMeta(),500)\n  }\n'''
          replace_once(old_start, new_start, 'startup meta scheduling')

          path.write_text(s, encoding='utf-8')
          PY

      - name: Verify diff
        run: |
          git diff --check
          git diff -- index.html

      - name: Commit speedup
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Speed up gallery initial loading"
          git push

