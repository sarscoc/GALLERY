name: One-shot retain loaded gallery thumbnails

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gallery-retain-loaded.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Keep loaded thumbnails visible
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          def once(old,new,label):
              global s
              if old not in s:
                  raise SystemExit(f'patch target not found: {label}')
              s=s.replace(old,new,1)

          once(
              '.card img{',
              '.card img,\n.card canvas{',
              'card visual css'
          )

          once(
              'const PAGE_SIZE = 12;\n',
              'const PAGE_SIZE = 12;\nconst RETAINED_THUMB_WIDTH = 420;\nconst RETAINED_THUMB_MAX_PIXELS = 320000;\n',
              'thumbnail constants'
          )

          once(
              'let columns=[];\n',
              'let columns=[];\n/* Once a thumbnail has actually been seen, keep a lightweight pixel snapshot\n   for the rest of this page session. This prevents signed/original URLs or\n   browser image eviction from leaving blank cards when scrolling back. */\nconst retainedThumbs=new Map();\n',
              'retained thumbnail map'
          )

          old='''function preloadImage(src,priority="auto"){\n  return new Promise(resolve=>{\n    const img=new Image();\n    img.decoding="async";\n    img.fetchPriority=priority;\n    img.onload=()=>resolve({ok:true,img});\n    img.onerror=()=>resolve({ok:false,img});\n    img.src=src\n  })\n}\n'''
          new='''function retainedThumbKey(item,src){\n  return String(item?.baseKey||item?.id||src||"")\n}\nfunction makeRetainedThumbnail(img,item){\n  const naturalW=Math.max(1,img.naturalWidth||img.width||1);\n  const naturalH=Math.max(1,img.naturalHeight||img.height||1);\n  const pixelScale=Math.sqrt(\n    RETAINED_THUMB_MAX_PIXELS/(naturalW*naturalH)\n  );\n  const scale=Math.min(\n    1,\n    RETAINED_THUMB_WIDTH/naturalW,\n    Number.isFinite(pixelScale)?pixelScale:1\n  );\n  const w=Math.max(1,Math.round(naturalW*scale));\n  const h=Math.max(1,Math.round(naturalH*scale));\n\n  const canvas=document.createElement("canvas");\n  canvas.width=w;\n  canvas.height=h;\n  canvas.setAttribute("role","img");\n  canvas.setAttribute("aria-label",item?.title||"");\n\n  const ctx=canvas.getContext("2d",{alpha:true});\n  if(ctx){\n    ctx.imageSmoothingEnabled=true;\n    ctx.imageSmoothingQuality="medium";\n    ctx.drawImage(img,0,0,w,h)\n  }\n  return canvas\n}\nfunction cloneRetainedThumbnail(master,item){\n  if(!master?.isConnected)return master;\n  if(!(master instanceof HTMLCanvasElement))return master.cloneNode(true);\n\n  const canvas=document.createElement("canvas");\n  canvas.width=master.width;\n  canvas.height=master.height;\n  canvas.setAttribute("role","img");\n  canvas.setAttribute("aria-label",item?.title||"");\n  const ctx=canvas.getContext("2d",{alpha:true});\n  if(ctx)ctx.drawImage(master,0,0);\n  return canvas\n}\nfunction preloadImage(src,priority="auto"){\n  return new Promise(resolve=>{\n    const img=new Image();\n    img.decoding="async";\n    img.fetchPriority=priority;\n    img.onload=()=>resolve({ok:true,img});\n    img.onerror=()=>resolve({ok:false,img});\n    img.src=src\n  })\n}\n'''
          once(old,new,'preload helpers')

          old='''async function appendItem(item,index,serial,priority="auto"){\n  const src=item.thumbUrl||item.url||item.originalUrl;\n  const loaded=await preloadImage(src,priority);\n  if(serial!==requestSerial||!loaded.ok)return;\n\n  const btn=document.createElement("button");\n  btn.className="card";\n  btn.type="button";\n  btn.setAttribute("aria-label",item.title||`画像 ${index+1}`);\n\n  const img=loaded.img;\n  img.alt=item.title||"";\n  img.draggable=false;\n\n  btn.appendChild(img);\n  btn.addEventListener("click",()=>openViewer(index));\n  shortestColumn().appendChild(btn)\n}\n'''
          new='''async function appendItem(item,index,serial,priority="auto"){\n  const src=item.thumbUrl||item.url||item.originalUrl;\n  const key=retainedThumbKey(item,src);\n  let retained=retainedThumbs.get(key)||null;\n\n  if(!retained){\n    const loaded=await preloadImage(src,priority);\n    if(serial!==requestSerial||!loaded.ok)return;\n    retained=makeRetainedThumbnail(loaded.img,item);\n    retainedThumbs.set(key,retained)\n  }\n\n  if(serial!==requestSerial)return;\n\n  const btn=document.createElement("button");\n  btn.className="card";\n  btn.type="button";\n  btn.setAttribute("aria-label",item.title||`画像 ${index+1}`);\n\n  const visual=cloneRetainedThumbnail(retained,item);\n  btn.appendChild(visual);\n  btn.addEventListener("click",()=>openViewer(index));\n  shortestColumn().appendChild(btn)\n}\n'''
          once(old,new,'appendItem')

          once(
              'const PAGE_CACHE_PREFIX="notion-image-gallery-page-v2:";',
              'const PAGE_CACHE_PREFIX="notion-image-gallery-page-v3:";',
              'page cache generation'
          )

          once(
              '''function firstPageCacheKey(investigator,type){\n  return PAGE_CACHE_PREFIX+encodeURIComponent(investigator||"")+":"+encodeURIComponent(type||"")\n}\n''',
              '''function firstPageCacheKey(investigator,type){\n  return PAGE_CACHE_PREFIX+encodeURIComponent(investigator||"")+":"+encodeURIComponent(type||"")\n}\nfunction firstPageCacheIsStable(data){\n  const items=Array.isArray(data?.items)?data.items:[];\n  return items.every(item=>{\n    const src=String(item?.thumbUrl||item?.url||"");\n    return src.includes("/media/thumb/")\n  })\n}\n''',
              'stable page cache helper'
          )

          once(
              '''    return parsed.data||null\n  }catch{\n''',
              '''    const data=parsed.data||null;\n    if(!firstPageCacheIsStable(data)){\n      localStorage.removeItem(firstPageCacheKey(investigator,type));\n      return null\n    }\n    return data\n  }catch{\n''',
              'reject unstable cached page'
          )

          once(
              '''function storeFirstPage(investigator,type,data){\n  try{\n''',
              '''function storeFirstPage(investigator,type,data){\n  if(!firstPageCacheIsStable(data))return;\n  try{\n''',
              'only cache R2 thumbs'
          )

          p.write_text(s,encoding='utf-8')
          PY

      - name: Verify patch
        run: |
          git diff --check
          grep -n "RETAINED_THUMB_WIDTH\|retainedThumbs\|PAGE_CACHE_PREFIX" index.html

      - name: Commit patch
        run: |
          if git diff --quiet -- index.html; then
            echo "No index changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Keep loaded gallery thumbnails visible"
          git push
