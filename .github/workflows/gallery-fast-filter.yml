name: Fast gallery filter patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gallery-fast-filter.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/patch_fast_filter.py
      - run: git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Speed up filtered gallery fallback"
          git push
