name: Fix gallery refresh flow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-refresh-flow.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix_refresh_flow.py
      - run: git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix gallery refresh consistency"
          git push
