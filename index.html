<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Image Gallery</title>
<style>
:root{
  --bg:#f5f5f5;
  --panel:rgba(18,18,21,.42);
  --panel2:rgba(255,255,255,.06);
  --text:#f4f4f4;
  --muted:rgba(0,0,0,.46);
  --line:rgba(255,255,255,.14);
  --gap:7px;
  --card-radius:0px;
  --ui-radius:3px;
}
*{box-sizing:border-box}
html,body{
  margin:0;min-height:100%;
  background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
}
body{overflow-x:hidden}
button,select{font:inherit}
button{cursor:pointer}

/* ---------- Gallery: stable masonry columns ---------- */
.gallery{
  width:100%;
  display:flex;
  align-items:flex-start;
  gap:var(--gap);
  padding:var(--gap);
}
.gallery-column{
  flex:1 1 0;
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:var(--gap);
}
.card{
  position:relative;
  z-index:0;
  display:block;
  width:100%;
  padding:0;
  border:0;
  border-radius:var(--card-radius);
  overflow:visible;
  background:transparent;
  transition:
    transform .18s cubic-bezier(.2,.7,.25,1),
    box-shadow .18s ease,
    filter .18s ease;
  transform-origin:center center;
}
.card img{
  display:block;
  width:100%;
  height:auto;
  object-fit:contain;
  background:transparent;
}
@media (hover:hover) and (pointer:fine){
  .card:hover{
    z-index:3;
    transform:scale(1.018);
    box-shadow:0 7px 18px rgba(0,0,0,.11);
    filter:brightness(1.015);
  }
}
.card:active{transform:scale(.997)}

.empty{
  width:100%;
  padding:70px 18px;
  text-align:center;
  color:var(--muted);
  font-size:12px;
}

/* ---------- Bottom loading ---------- */
.status{
  min-height:54px;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
}
.status[hidden]{display:none}
.loader{
  width:54px;
  height:2px;
  position:relative;
  overflow:hidden;
  background:rgba(0,0,0,.07);
}
.loader::after{
  content:"";
  position:absolute;
  inset:0;
  width:42%;
  background:rgba(0,0,0,.28);
  animation:gallery-loading 1s ease-in-out infinite;
}
@keyframes gallery-loading{
  0%{transform:translateX(-130%)}
  100%{transform:translateX(340%)}
}
.load-more-status{
  min-height:54px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:0;
}
.load-more-status.hidden{display:none}
.load-more-status::before{
  content:"";
  width:48px;
  height:2px;
  display:block;
  background:
    linear-gradient(
      90deg,
      transparent 0%,
      rgba(0,0,0,.25) 42%,
      rgba(0,0,0,.25) 58%,
      transparent 100%
    );
  background-size:220% 100%;
  animation:gallery-loading-bottom 1s linear infinite;
}
@keyframes gallery-loading-bottom{
  from{background-position:120% 0}
  to{background-position:-120% 0}
}

/* ---------- Floating menu ---------- */
.menu-button{
  position:fixed;
  top:max(10px,env(safe-area-inset-top));
  left:10px;
  z-index:120;
  width:40px;height:40px;
  border:1px solid rgba(255,255,255,.17);
  border-radius:var(--ui-radius);
  background:rgba(16,16,18,.20);
  color:#fff;
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  display:grid;
  place-items:center;
  font-size:21px;
  line-height:1;
  box-shadow:0 5px 16px rgba(0,0,0,.08);
}

.viewer-close{
  position:fixed;
  top:max(10px,env(safe-area-inset-top));
  left:10px;
  z-index:10020;
  width:40px;
  height:40px;
  padding:0;
  border:1px solid rgba(255,255,255,.17);
  border-radius:var(--ui-radius);
  background:rgba(16,16,18,.20);
  color:#fff;
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  display:grid;
  place-items:center;
  font-family:inherit;
  font-size:21px;
  font-weight:400;
  line-height:1;
  box-shadow:0 5px 16px rgba(0,0,0,.08);
  cursor:pointer;
  appearance:none;
  -webkit-appearance:none;
}
.viewer-close:hover{
  background:rgba(16,16,18,.28);
}

.menu-button span{transform:translateY(-1px)}
.menu{
  position:fixed;
  top:max(58px,calc(env(safe-area-inset-top) + 58px));
  
  z-index:119;
  width:min(300px,calc(100vw - 20px));
  padding:11px;
  border:1px solid var(--line);
  border-radius:var(--ui-radius);
  background:var(--panel);
  backdrop-filter:blur(22px) saturate(120%);
  -webkit-backdrop-filter:blur(22px) saturate(120%);
  box-shadow:0 14px 36px rgba(0,0,0,.14);
  opacity:0;
  transform:translateY(-5px);
  pointer-events:none;
  transition:opacity .12s ease,transform .12s ease;

  left:10px;
}
.menu.open{
  opacity:1;
  transform:translateY(0);
  pointer-events:auto;
}
.menu-label{
  display:block;
  margin:3px 1px 6px;
  color:rgba(255,255,255,.62);
  font-size:10px;
  letter-spacing:.14em;
  text-transform:uppercase;
}
.control{
  width:100%;
  height:40px;
  margin:0 0 9px;
  padding:0 9px;
  border:1px solid var(--line);
  border-radius:var(--ui-radius);
  background:rgba(255,255,255,.055);
  color:#fff;
  outline:none;
}
.control option{color:#111;background:#fff}
.menu-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}
.menu-action{
  min-height:38px;
  border:1px solid var(--line);
  border-radius:var(--ui-radius);
  background:var(--panel2);
  color:#fff;
  padding:7px 8px;
  font-size:12px;
}
.menu-action.wide{grid-column:1/-1}
.menu-note{
  padding:8px 1px 1px;
  color:rgba(255,255,255,.43);
  font-size:10px;
  line-height:1.45;
}

/* ---------- Viewer ---------- */
.viewer{
  position:fixed;
  inset:0;
  z-index:9999;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.32);
  color:#fff;
  overflow:hidden;
}
.viewer.open{display:flex}
.viewer-fullscreen{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  background:transparent;
  overflow:hidden;
}
.viewer-fullscreen:fullscreen{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  background:#000;
}
.viewer-fullscreen::backdrop{
  background:#000;
}
.viewer-stage{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.viewer-image{
  display:block;
  max-width:100vw;
  max-height:100vh;
  width:auto;height:auto;
  object-fit:contain;
  user-select:none;
  -webkit-user-drag:none;
  will-change:transform,opacity;
  transform-origin:center center;
  transition:transform .16s ease,opacity .14s ease;
  cursor:zoom-in;
}
.viewer-image.zoomed{cursor:zoom-out}

/* tag: lazy-loaded when the image viewer opens */
.viewer-tags{
  position:absolute;
  top:58px;
  left:10px;
  z-index:6;
  max-width:min(52vw,620px);
  display:flex;
  flex-wrap:wrap;
  gap:5px 10px;
  padding:8px 10px;
  background:rgba(0,0,0,.18);
  border:1px solid rgba(255,255,255,.12);
  border-radius:var(--ui-radius);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  color:#fff;
  font-size:12px;
  line-height:1.5;
  opacity:0;
  pointer-events:none;
  transition:opacity .14s ease;
}
.viewer-tags.show{
  opacity:1;
  pointer-events:auto;
}
.viewer-tags a{
  color:#fff;
  text-decoration:none;
  border-bottom:1px solid rgba(255,255,255,.38);
  text-shadow:0 1px 4px rgba(0,0,0,.22);
}
.viewer-tags a:hover{
  border-bottom-color:rgba(255,255,255,.82);
}
.viewer-tags .tag-hash{
  opacity:.58;
  margin-right:2px;
}

.viewer-arrow{
  position:absolute;
  top:50%;
  z-index:5;
  transform:translateY(-50%);
  width:52px;height:52px;
  border:1px solid rgba(255,255,255,.19);
  border-radius:var(--ui-radius);
  background:rgba(0,0,0,.28);
  color:#fff;
  font-size:34px;
  line-height:1;
}
.viewer-prev{left:16px}
.viewer-next{right:16px}
.viewer-count{
  position:absolute;
  left:50%;
  bottom:max(14px,env(safe-area-inset-bottom));
  z-index:5;
  transform:translateX(-50%);
  padding:5px 8px;
  border-radius:var(--ui-radius);
  background:rgba(0,0,0,.26);
  color:rgba(255,255,255,.70);
  font-size:10px;
  letter-spacing:.08em;
}
.mobile-hint{
  display:none;
  position:absolute;
  left:50%;
  top:max(13px,env(safe-area-inset-top));
  z-index:4;
  transform:translateX(-50%);
  padding:4px 7px;
  border-radius:var(--ui-radius);
  background:rgba(0,0,0,.22);
  color:rgba(255,255,255,.56);
  font-size:10px;
  white-space:nowrap;
}
.toast{
  position:fixed;
  left:50%;
  bottom:22px;
  z-index:10001;
  transform:translateX(-50%);
  padding:7px 11px;
  border-radius:var(--ui-radius);
  background:#222;
  color:#fff;
  font-size:11px;
  opacity:0;
  pointer-events:none;
  transition:opacity .14s ease;
}
.toast.show{opacity:1}

body.embed .gallery{padding:4px;gap:4px}
body.embed .gallery-column{gap:4px}

/* ---------- Light minimal scrollbar ---------- */
html{
  scrollbar-width:thin;
  scrollbar-color:rgba(0,0,0,.13) transparent;
}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{
  background:rgba(0,0,0,.13);
  border-radius:0;
}
::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,.20)}

@media (hover:none) and (pointer:coarse){
  .viewer{touch-action:none;overscroll-behavior:none}
  .viewer-arrow{display:none}
  .viewer-tags{
    top:58px;
    left:10px;
    max-width:calc(100vw - 18px);
    
    font-size:11px;
    padding:7px 8px;
  }
  
  .mobile-hint{display:block}
}
@media(max-width:600px){
  :root{--gap:4px}
  .gallery{padding:4px;gap:4px}
  .gallery-column{gap:4px}
  .menu-button{top:max(7px,env(safe-area-inset-top));
  left:10px;
}
  .menu{top:max(53px,calc(env(safe-area-inset-top) + 53px))
  left:10px;
}
}

.viewer-fullscreen:fullscreen .viewer-tags{
  display:none;

  left:10px;
}


/* Notion右上UIと競合しないよう、操作系は左上に統一 */
body:has(.viewer.open) .menu-button,
body:has(.viewer.open) .menu{
  display:none !important;

  left:10px;
}


body.viewer-active .menu-button,
body.viewer-active .menu{
  display:none !important;

  left:10px;
}

</style>
</head>
<body>

<button id="menuButton" class="menu-button" type="button" aria-label="メニュー" aria-expanded="false">
  <span>≡</span>
</button>

<aside id="menu" class="menu" aria-hidden="true">
  <label class="menu-label" for="investigatorFilter">ɪɴᴠᴇꜱᴛɪɢᴀᴛᴏʀ</label>
  <select id="investigatorFilter" class="control">
    <option value="">すべて</option>
  </select>

  <label class="menu-label" for="typeFilter">種別</label>
  <select id="typeFilter" class="control">
    <option value="">すべて</option>
  </select>

  <div class="menu-actions">
    <button id="copyEmbedBtn" class="menu-action wide" type="button">埋め込みURLをコピー</button>
    <button id="reloadBtn" class="menu-action" type="button">更新</button>
    <button id="clearBtn" class="menu-action" type="button">絞り込み解除</button>
  </div>
  <div class="menu-note">ダブルクリック / ダブルタップで元画像まで拡大</div>
</aside>

<main id="gallery" class="gallery"></main>
<div id="status" class="status"><div class="loader" aria-label="読み込み中"></div></div>
<div id="loadMoreStatus" class="load-more-status hidden">LOADING…</div>
<div id="loadMoreSentinel" style="height:1px"></div>

<section id="viewer" class="viewer" aria-hidden="true">
  <div id="viewerFullscreen" class="viewer-fullscreen">
    <div id="viewerStage" class="viewer-stage">
      <img id="viewerImage" class="viewer-image" alt="">
    </div>
    <div id="viewerTags" class="viewer-tags" aria-label="tag"></div>
    <button id="viewerClose" class="viewer-close" type="button" aria-label="閉じる">×</button>
    <button id="viewerPrev" class="viewer-arrow viewer-prev" type="button" aria-label="前の画像">‹</button>
    <button id="viewerNext" class="viewer-arrow viewer-next" type="button" aria-label="次の画像">›</button>
    <div id="viewerCount" class="viewer-count"></div>
    <div class="mobile-hint">← → NEXT　↓ CLOSE　DOUBLE TAP ZOOM</div>
  </div>
</section>

<div id="toast" class="toast"></div>

<script>
const WORKER_URL = "https://notion-image-gallery.sarscoc.workers.dev/";
const PAGE_SIZE = 18;
const ZOOM_SCALE = 2.5;
const TRY_DEVICE_FULLSCREEN = true;

const initialParams = new URLSearchParams(location.search);
const embedMode = initialParams.get("embed") === "1";
if(embedMode)document.body.classList.add("embed");

const els = {
  gallery:document.getElementById("gallery"),
  status:document.getElementById("status"),
  loadMoreStatus:document.getElementById("loadMoreStatus"),
  sentinel:document.getElementById("loadMoreSentinel"),
  menuButton:document.getElementById("menuButton"),
  menu:document.getElementById("menu"),
  investigator:document.getElementById("investigatorFilter"),
  type:document.getElementById("typeFilter"),
  copy:document.getElementById("copyEmbedBtn"),
  reload:document.getElementById("reloadBtn"),
  clear:document.getElementById("clearBtn"),
  viewer:document.getElementById("viewer"),
  viewerFullscreen:document.getElementById("viewerFullscreen"),
  viewerStage:document.getElementById("viewerStage"),
  viewerTags:document.getElementById("viewerTags"),
  viewerImage:document.getElementById("viewerImage"),
  viewerCount:document.getElementById("viewerCount"),
  viewerClose:document.getElementById("viewerClose"),
  viewerPrev:document.getElementById("viewerPrev"),
  viewerNext:document.getElementById("viewerNext"),
  toast:document.getElementById("toast")
};

let columns=[];
let loadedItems=[];
let nextCursor="";
let hasMore=true;
let loadingPage=false;
let requestSerial=0;
let currentIndex=-1;
let zoomed=false;
let touchStart=null,touchLast=null,touchDragging=false;
let lastTapTime=0,lastTapX=0,lastTapY=0;
const tagInfoCache=new Map();
let tagInfoSerial=0;

const coarsePointer=()=>matchMedia("(hover:none) and (pointer:coarse)").matches;
function base(){return WORKER_URL.replace(/\/+$/,"")}

function showToast(text){
  els.toast.textContent=text;
  els.toast.classList.add("show");
  clearTimeout(showToast.t);
  showToast.t=setTimeout(()=>els.toast.classList.remove("show"),1500)
}
function setMenu(open){
  els.menu.classList.toggle("open",open);
  els.menu.setAttribute("aria-hidden",open?"false":"true");
  els.menuButton.setAttribute("aria-expanded",open?"true":"false")
}
function currentFilters(){
  return {investigator:els.investigator.value||"",type:els.type.value||""}
}
function updateAddressBar(){
  const {investigator,type}=currentFilters();
  const p=new URLSearchParams(location.search);
  investigator?p.set("investigator",investigator):p.delete("investigator");
  type?p.set("type",type):p.delete("type");
  embedMode?p.set("embed","1"):p.delete("embed");
  p.delete("refresh");
  const q=p.toString();
  history.replaceState(null,"",location.pathname+(q?"?"+q:"")+location.hash)
}
function makeEmbedUrl(){
  const u=new URL(location.href);
  const {investigator,type}=currentFilters();
  investigator?u.searchParams.set("investigator",investigator):u.searchParams.delete("investigator");
  type?u.searchParams.set("type",type):u.searchParams.delete("type");
  u.searchParams.set("embed","1");
  u.searchParams.delete("refresh");
  return u.toString()
}
async function copyText(text){
  try{await navigator.clipboard.writeText(text)}
  catch{
    const ta=document.createElement("textarea");
    ta.value=text;document.body.appendChild(ta);ta.select();
    document.execCommand("copy");ta.remove()
  }
}
function fillSelect(select,rows,selected){
  while(select.options.length>1)select.remove(1);
  for(const row of rows){
    const opt=document.createElement("option");
    opt.value=row.value;
    opt.textContent=row.label;
    select.appendChild(opt)
  }
  select.value=selected||"";
  if(selected&&select.value!==selected){
    const o=new Option("指定中",selected);
    select.add(o);select.value=selected
  }
}
async function apiGet(path,params={},force=false){
  const u=new URL(base()+path);
  Object.entries(params).forEach(([k,v])=>{
    if(v!==""&&v!==null&&v!==undefined)u.searchParams.set(k,String(v))
  });
  if(force)u.searchParams.set("refresh","1");
  const res=await fetch(u.toString(),{cache:force?"reload":"default"});
  const data=await res.json().catch(()=>({}));
  if(!res.ok)throw new Error(data.error||`HTTP ${res.status}`);
  return data
}

/* スクショくらいの細さでも3列 */
function desiredColumnCount(){
  const w=window.innerWidth;
  if(w<380)return 2;
  if(w<1050)return 3;
  if(w<1350)return 4;
  if(w<1650)return 5;
  return 6
}
function createColumns(){
  const count=desiredColumnCount();
  els.gallery.innerHTML="";
  columns=[];
  for(let i=0;i<count;i++){
    const col=document.createElement("div");
    col.className="gallery-column";
    els.gallery.appendChild(col);
    columns.push(col)
  }
}
function shortestColumn(){
  let best=columns[0];
  let bestH=best?.offsetHeight??0;
  for(let i=1;i<columns.length;i++){
    const h=columns[i].offsetHeight;
    if(h<bestH){best=columns[i];bestH=h}
  }
  return best
}
function preloadImage(src,priority="auto"){
  return new Promise(resolve=>{
    const img=new Image();
    img.decoding="async";
    img.fetchPriority=priority;
    img.onload=()=>resolve({ok:true,img});
    img.onerror=()=>resolve({ok:false,img});
    img.src=src
  })
}
async function appendItem(item,index,serial,priority="auto"){
  const src=item.thumbUrl||item.url||item.originalUrl;
  const loaded=await preloadImage(src,priority);
  if(serial!==requestSerial||!loaded.ok)return;

  const btn=document.createElement("button");
  btn.className="card";
  btn.type="button";
  btn.setAttribute("aria-label",item.title||`画像 ${index+1}`);

  const img=loaded.img;
  img.alt=item.title||"";
  img.draggable=false;

  btn.appendChild(img);
  btn.addEventListener("click",()=>openViewer(index));
  shortestColumn().appendChild(btn)
}
async function appendBatch(items,startIndex,serial,firstPage){
  await Promise.all(items.map((item,i)=>
    appendItem(item,startIndex+i,serial,firstPage&&i<6?"high":"auto")
  ))
}
const META_STORAGE_KEY="notion-image-gallery-meta-v1";

function readStoredMeta(){
  try{
    const raw=localStorage.getItem(META_STORAGE_KEY);
    if(!raw)return null;
    const parsed=JSON.parse(raw);
    return parsed&&Array.isArray(parsed.investigators)&&Array.isArray(parsed.types)
      ? parsed
      : null
  }catch{
    return null
  }
}
function storeMeta(data){
  try{
    localStorage.setItem(
      META_STORAGE_KEY,
      JSON.stringify({
        investigators:Array.isArray(data?.investigators)?data.investigators:[],
        types:Array.isArray(data?.types)?data.types:[]
      })
    )
  }catch{}
}
function applyMeta(data){
  const wantedInv=els.investigator.value||initialParams.get("investigator")||"";
  const wantedType=els.type.value||initialParams.get("type")||"";

  fillSelect(
    els.investigator,
    (data.investigators||[]).map(x=>({value:x.id,label:x.name||x.id})),
    wantedInv
  );
  fillSelect(
    els.type,
    (data.types||[]).map(x=>({value:x,label:x})),
    wantedType
  )
}

async function loadMeta(force=false){
  /* 前回取得分があればまず即表示。Notion/API待ちでリストを空にしない。 */
  if(!force){
    const stored=readStoredMeta();
    if(stored)applyMeta(stored)
  }

  try{
    const data=await apiGet("/meta",{},force);

    /* 空レスポンスで正常だった前回候補を消さない */
    if(
      Array.isArray(data.investigators) &&
      data.investigators.length
    ){
      applyMeta(data);
      storeMeta(data)
    }else{
      console.warn("Meta returned no investigators:",data)
    }

    if(data.warnings?.length)console.warn("Meta warnings:",data.warnings)
  }catch(err){
    console.warn("meta:",err)
  }
}
async function loadNextPage(force=false){
  if(loadingPage||!hasMore)return;
  loadingPage=true;

  const serial=requestSerial;
  const firstPage=loadedItems.length===0;

  if(firstPage){
    els.status.hidden=false;
    els.status.innerHTML='<div class="loader" aria-label="読み込み中"></div>';
  }else{
    els.loadMoreStatus.classList.remove("hidden")
  }

  try{
    const {investigator,type}=currentFilters();
    const data=await apiGet("/gallery-page",{
      investigator,
      type,
      cursor:nextCursor,
      page_size:PAGE_SIZE
    },force);

    if(serial!==requestSerial)return;

    const items=Array.isArray(data.items)?data.items:[];
    const startIndex=loadedItems.length;

    loadedItems.push(...items);
    nextCursor=data.nextCursor||"";
    hasMore=Boolean(data.hasMore);

    await appendBatch(items,startIndex,serial,firstPage);

    if(!loadedItems.length&&!hasMore){
      els.gallery.innerHTML='<div class="empty">該当する画像がありません。</div>'
    }
  }catch(err){
    console.error(err);
    if(firstPage){
      els.status.innerHTML="";
      const message=document.createElement("div");
      message.className="empty";
      message.textContent="読み込みに失敗しました："+err.message;
      els.gallery.innerHTML="";
      els.gallery.appendChild(message)
    }
  }finally{
    if(firstPage)els.status.hidden=true;
    loadingPage=false;
    els.loadMoreStatus.classList.add("hidden")
  }
}
async function resetAndLoad(force=false){
  requestSerial++;
  loadedItems=[];
  nextCursor="";
  hasMore=true;
  loadingPage=false;
  createColumns();
  await loadNextPage(force)
}

function clearViewerTags(){
  tagInfoSerial++;
  els.viewerTags.replaceChildren();
  els.viewerTags.classList.remove("show");
}
function renderViewerTags(items){
  els.viewerTags.replaceChildren();

  for(const item of (items||[])){
    if(!item?.name||!item?.url)continue;

    const a=document.createElement("a");
    a.href=item.url;
    a.target="_blank";
    a.rel="noopener noreferrer";
    a.title=item.source||"";

    const hash=document.createElement("span");
    hash.className="tag-hash";
    hash.textContent="#";

    a.appendChild(hash);
    a.appendChild(document.createTextNode(item.name));
    a.addEventListener("click",e=>e.stopPropagation());

    els.viewerTags.appendChild(a)
  }

  els.viewerTags.classList.toggle(
    "show",
    els.viewerTags.childElementCount>0
  )
}
async function loadViewerTags(item){
  const serial=++tagInfoSerial;
  els.viewerTags.replaceChildren();
  els.viewerTags.classList.remove("show");

  if(!item?.pageId)return;

  /* R2に既にtag JSONがある場合、gallery-pageのレスポンスに
     tagItemsを同梱するので通信待ちなしで即表示。 */
  if(Array.isArray(item.tagItems)){
    renderViewerTags(item.tagItems);
    return;
  }

  try{
    let data=tagInfoCache.get(item.tagKey||item.pageId);

    if(!data){
      data=await apiGet("/tag-info",{
        page_id:item.pageId,
        tag_key:item.tagKey||""
      });
      tagInfoCache.set(item.tagKey||item.pageId,data);
    }

    if(serial!==tagInfoSerial)return;

    item.tagItems=Array.isArray(data.items)?data.items:[];
    renderViewerTags(item.tagItems);
  }catch(err){
    console.warn("tag-info:",err)
  }
}

function viewerSource(item){
  return item?.previewUrl||item?.url||item?.originalUrl||""
}
function originalSource(item){
  return item?.originalUrl||item?.url||item?.previewUrl||""
}
function resetZoom(restorePreview=false){
  zoomed=false;
  els.viewerImage.classList.remove("zoomed");
  els.viewerImage.style.transform="translate3d(0,0,0) scale(1)";
  els.viewerImage.style.transformOrigin="center center";

  if(restorePreview&&currentIndex>=0&&loadedItems[currentIndex]){
    const src=viewerSource(loadedItems[currentIndex]);
    if(src&&els.viewerImage.src!==src)els.viewerImage.src=src
  }
}
function toggleZoom(clientX=null,clientY=null){
  if(!els.viewer.classList.contains("open"))return;

  if(zoomed){
    resetZoom(true);
    return
  }

  const item=loadedItems[currentIndex];
  if(!item)return;

  zoomed=true;
  els.viewerImage.classList.add("zoomed");

  if(clientX!==null&&clientY!==null){
    const rect=els.viewerImage.getBoundingClientRect();
    if(rect.width&&rect.height){
      const px=Math.max(0,Math.min(100,((clientX-rect.left)/rect.width)*100));
      const py=Math.max(0,Math.min(100,((clientY-rect.top)/rect.height)*100));
      els.viewerImage.style.transformOrigin=`${px}% ${py}%`
    }
  }

  const original=originalSource(item);
  if(original)els.viewerImage.src=original;
  els.viewerImage.style.transform=`translate3d(0,0,0) scale(${ZOOM_SCALE})`
}
async function enterRealFullscreen(){
  if(!TRY_DEVICE_FULLSCREEN||document.fullscreenElement)return;

  try{
    if(els.viewerFullscreen.requestFullscreen){
      els.viewer.dataset.wasFullscreen="1";
      await els.viewerFullscreen.requestFullscreen({navigationUI:"hide"});
    }
  }catch{
    /* Fullscreen不可なら埋め込み内プレビューのまま。 */
  }
}
async function openViewer(index){
  if(index<0||index>=loadedItems.length)return;

  currentIndex=index;
  resetZoom();
  updateViewerImage();

  /* 1回クリックでは埋め込み内プレビューだけ。 */
  document.body.classList.add("viewer-active");
  els.viewer.classList.add("open");
  els.viewer.setAttribute("aria-hidden","false");
  document.body.style.overflow="hidden";
}
function updateViewerImage(){
  if(currentIndex<0||!loadedItems[currentIndex])return;

  resetZoom();
  const item=loadedItems[currentIndex];

  clearViewerTags();

  els.viewerImage.style.opacity=".45";
  els.viewerImage.src=viewerSource(item);
  els.viewerImage.alt=item.title||"";
  els.viewerCount.textContent=`${currentIndex+1} / ${loadedItems.length}${hasMore?" +":""}`;

  requestAnimationFrame(()=>els.viewerImage.style.opacity="1");
  loadViewerTags(item);

  if(hasMore&&currentIndex>=loadedItems.length-4){
    loadNextPage()
  }
}
async function go(delta){
  if(!loadedItems.length)return;

  if(delta>0&&currentIndex===loadedItems.length-1&&hasMore){
    const oldLength=loadedItems.length;
    await loadNextPage();

    if(loadedItems.length>oldLength){
      currentIndex++;
      updateViewerImage();
      return
    }
  }

  currentIndex=(currentIndex+delta+loadedItems.length)%loadedItems.length;
  updateViewerImage()
}
async function closeViewer(){
  document.body.classList.remove("viewer-active");
  els.viewer.classList.remove("open");
  els.viewer.setAttribute("aria-hidden","true");
  document.body.style.overflow="";
  currentIndex=-1;
  resetZoom();
  clearViewerTags();

  els.viewer.dataset.wasFullscreen="";

  if(document.fullscreenElement){
    try{await document.exitFullscreen()}catch{}
  }
}

/* Desktop: buttons / keyboard / double-click zoom */
els.viewerImage.addEventListener("dblclick",async e=>{
  if(coarsePointer())return;
  e.preventDefault();
  e.stopPropagation();

  if(!document.fullscreenElement){
    await enterRealFullscreen();
  }else{
    toggleZoom(e.clientX,e.clientY);
  }
});

/* Empty area closes viewer */
els.viewer.addEventListener("click",e=>{
  if(
    e.target===els.viewer||
    e.target===els.viewerFullscreen||
    e.target===els.viewerStage
  ){
    closeViewer();
  }
});

/* Smartphone only: swipe / down-close / double tap */
els.viewer.addEventListener("touchstart",e=>{
  if(!coarsePointer()||e.touches.length!==1)return;
  const t=e.touches[0];

  const now=Date.now();
  const nearPreviousTap=Math.hypot(t.clientX-lastTapX,t.clientY-lastTapY)<45;

  if(now-lastTapTime<320&&nearPreviousTap){
    e.preventDefault();

    if(!document.fullscreenElement){
      enterRealFullscreen();
    }else{
      toggleZoom(t.clientX,t.clientY);
    }

    lastTapTime=0;
    touchDragging=false;
    touchStart=null;
    touchLast=null;
    return
  }

  lastTapTime=now;
  lastTapX=t.clientX;
  lastTapY=t.clientY;

  if(zoomed)return;

  touchDragging=true;
  touchStart={x:t.clientX,y:t.clientY};
  touchLast={...touchStart}
},{passive:false});

els.viewer.addEventListener("touchmove",e=>{
  if(!coarsePointer()||!touchDragging||!touchStart||zoomed||e.touches.length!==1)return;
  e.preventDefault();

  const t=e.touches[0];
  touchLast={x:t.clientX,y:t.clientY};

  const dx=touchLast.x-touchStart.x;
  const dy=touchLast.y-touchStart.y;
  let tx=dx,ty=0;

  if(Math.abs(dy)>Math.abs(dx)){
    tx=0;
    ty=Math.max(0,dy)
  }

  els.viewerImage.style.transition="none";
  els.viewerImage.style.transform=`translate3d(${tx}px,${ty}px,0) scale(1)`;

  if(ty>0){
    els.viewerImage.style.opacity=String(Math.max(.32,1-ty/380))
  }
},{passive:false});

els.viewer.addEventListener("touchend",()=>{
  if(!coarsePointer()||!touchDragging||!touchStart||!touchLast||zoomed){
    touchDragging=false;touchStart=null;touchLast=null;return
  }

  const dx=touchLast.x-touchStart.x;
  const dy=touchLast.y-touchStart.y;
  const ax=Math.abs(dx),ay=Math.abs(dy);

  els.viewerImage.style.transition="transform .16s ease,opacity .16s ease";
  els.viewerImage.style.transform="translate3d(0,0,0) scale(1)";
  els.viewerImage.style.opacity="1";

  if(dy>80&&ay>ax*1.12){
    closeViewer()
  }else if(ax>50&&ax>ay*1.08){
    go(dx<0?1:-1)
  }

  touchDragging=false;touchStart=null;touchLast=null
});

els.menuButton.addEventListener("click",e=>{
  e.stopPropagation();
  setMenu(!els.menu.classList.contains("open"))
});
els.menu.addEventListener("click",e=>e.stopPropagation());
document.addEventListener("click",()=>setMenu(false));

els.investigator.addEventListener("change",()=>{
  updateAddressBar();
  resetAndLoad()
});
els.type.addEventListener("change",()=>{
  updateAddressBar();
  resetAndLoad()
});
els.clear.addEventListener("click",()=>{
  els.investigator.value="";
  els.type.value="";
  updateAddressBar();
  resetAndLoad()
});
els.reload.addEventListener("click",async()=>{
  await Promise.all([loadMeta(true),resetAndLoad(true)]);
  showToast("最新データに更新しました")
});
els.copy.addEventListener("click",async()=>{
  await copyText(makeEmbedUrl());
  showToast("埋め込みURLをコピーしました")
});

els.viewerClose.addEventListener("click",e=>{
  e.stopPropagation();
  closeViewer()
});
els.viewerPrev.addEventListener("click",e=>{
  e.stopPropagation();
  go(-1)
});
els.viewerNext.addEventListener("click",e=>{
  e.stopPropagation();
  go(1)
});


document.addEventListener("fullscreenchange",()=>{
  /* ブラウザのEsc等で本物のFullscreenを抜けた場合も、
     プレビューへ戻さず最初のギャラリーへ戻る。 */
  if(
    !document.fullscreenElement &&
    els.viewer.classList.contains("open") &&
    els.viewer.dataset.wasFullscreen==="1"
  ){
    els.viewer.dataset.wasFullscreen="";
    closeViewer();
  }
});

document.addEventListener("keydown",e=>{
  if(!els.viewer.classList.contains("open"))return;
  if(e.key==="ArrowRight")go(1);
  else if(e.key==="ArrowLeft")go(-1);
  else if(e.key==="Escape")closeViewer()
});

/* 下に近づいたら次ページ */
const observer=new IntersectionObserver(entries=>{
  if(entries.some(x=>x.isIntersecting))loadNextPage()
},{root:null,rootMargin:"700px 0px",threshold:0});
observer.observe(els.sentinel);

let resizeTimer;
window.addEventListener("resize",()=>{
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(()=>{
    const wanted=desiredColumnCount();
    if(columns.length&&columns.length!==wanted){
      const scrollY=window.scrollY;
      const oldItems=[...loadedItems];
      createColumns();

      Promise.all(oldItems.map((item,index)=>
        appendItem(item,index,requestSerial)
      )).then(()=>requestAnimationFrame(()=>window.scrollTo(0,scrollY)))
    }
  },180)
});

(async()=>{
  const wantedInv=initialParams.get("investigator")||"";
  const wantedType=initialParams.get("type")||"";

  if(wantedInv){
    const o=new Option("指定中",wantedInv);
    els.investigator.add(o);
    els.investigator.value=wantedInv
  }
  if(wantedType){
    const o=new Option(wantedType,wantedType);
    els.type.add(o);
    els.type.value=wantedType
  }

  createColumns();

  /* INVESTIGATOR候補と画像を同時に開始。
     メニュー候補が画像18枚の読込完了を待たない。 */
  loadMeta();
  await loadNextPage()
})();
</script>
